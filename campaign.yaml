name: "First Through"
description: "A Mythras Imperative campaign for a first-time roleplayer, set in the real stellar neighbourhood. Nine hundred and seventy-five years ago robotic seedships carried anchor pairs out at a twentieth of lightspeed; where one arrived, a door opened, and that is the only way between stars. Transit is instant, everything else obeys the speed of light, and the moment you step through nobody can reach you. You are a first-through: fifteen, newest the Threshold has taken in years. The old doors are failing faster than age explains, and the one everybody has waited nine centuries for opens in a year."
game_date: "d-1/night -- the evening before the player's first posting"
current_scene: "NOTHING HAS BEGUN AND NO CHARACTER EXISTS. Run /first-through:start. There are no pre-gens -- build the player's character at the table, three stages out loud (Culture 100, Career 100, Bonus 150, 15 points maximum per skill per stage), from lore/character-creation/. Create the fetch as an NPC too; it is a person, not kit. Open LIGHT: the ready room at the Nine, the kettle argument, one short crossing that works. 'How Many' (lore/entry-points/) is the hard one and it arrives on d1, not now. Do not narrate a scene until the character is built and set-scene has been called."
